<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up — FocusShield</title>

    <link rel="icon" href="assets/icons/favicon.png" type="image/png">

    <!-- FONTAWESOME ICONS -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/auth.css">

    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container header-container">

            <a href="index.html" class="logo">

                <img src="assets/icons/logo.png" alt="FocusShield Logo" class="logo-image">

                <span class="logo-text">FocusShield</span>

            </a>

            <nav class="navigation">

                <ul class="navigation-list">

                    <li><a href="index.html" class="navigation-link">Home</a></li>

                    <li><a href="about.html" class="navigation-link">About</a></li>

                    <li><a href="index.html#features" class="navigation-link">Features</a></li>

                    <li><a href="index.html#how-it-works" class="navigation-link">How it Works</a></li>

                    <li><a href="index.html#pricing" class="navigation-link">Pricing</a></li>

                    <li><a href="login.html" class="navigation-link">Log In</a></li>

                </ul>

            </nav>

            <div class="header-actions">

                <a href="downloads/FocusShield-Extension.zip" download="FocusShield-Extension.zip" class="button button-primary">

                    Download Extension

                </a>

            </div>

        </div>

    </header>

    <!-- MAIN -->

    <main class="auth-page">

        <div class="auth-card">

            <h1 class="page-title">Create Account</h1>

            <p class="page-description">Join FocusShield and reclaim 3+ hours every day.</p>

            <div id="status-message" class="message" hidden></div>

            <form id="signup-form">

                <div class="form-group">

                    <label class="form-label"><i class="fa-solid fa-user"></i> Full Name</label>

                    <input type="text" id="username-input" class="form-input" placeholder="Julius Kirima" required>

                </div>

                <div class="form-group">

                    <label class="form-label"><i class="fa-solid fa-envelope"></i> Email Address</label>

                    <input type="email" id="email-input" class="form-input" placeholder="you@example.com" required>

                </div>

                <div class="form-group">

                    <label class="form-label"><i class="fa-solid fa-key"></i> Password</label>

                    <input type="password" id="password-input" class="form-input" placeholder="••••••••" required>

                </div>

                <button type="submit" id="signup-btn" class="button button-primary"><i class="fa-solid fa-user-plus"></i> Create Free Account</button>

            </form>

            <div class="auth-footer">

                Already have an account? <a href="login.html">Sign In</a>

            </div>

        </div>

    </main>

    <script type="module" src="js/auth.js"></script>

</body>

</html>
